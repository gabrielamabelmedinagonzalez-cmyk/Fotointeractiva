<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda Holística ODECO</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f1eb;
  }
  .page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
  }
  .ad {
    position: relative;
    width: min(100%, 700px);
    line-height: 0;
    overflow: hidden;
    border-radius: 8px;
  }
  .ad img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ÚNICO ELEMENTO INTERACTIVO: botón WhatsApp */
  .whatsapp-button {
    position: absolute;
    left: 51%;
    right: 1.5%;
    bottom: 1.7%;
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .55em;
    padding: .65em .85em;
    border-radius: 18px;
    text-decoration: none;
    cursor: pointer;
    color: #fff;
    background:
      linear-gradient(180deg, #214ca7 0%, #123b91 48%, #092c73 100%);
    border: 3px solid #d5aa38;
    box-shadow:
      0 7px 0 #755914,
      0 12px 20px rgba(0,0,0,.32),
      inset 0 2px 1px rgba(255,255,255,.55),
      inset 0 -4px 7px rgba(0,0,0,.28);
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    line-height: 1;
    z-index: 5;
  }
  .whatsapp-button::before {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    top: 6px;
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.22);
    filter: blur(1px);
    pointer-events: none;
  }
  .whatsapp-icon {
    width: 1.45em;
    height: 1.45em;
    flex: 0 0 auto;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #fff;
    color: #168b4b;
    font-size: 1.05em;
    font-weight: 900;
    box-shadow:
      0 2px 3px rgba(0,0,0,.28),
      inset 0 1px 1px rgba(255,255,255,.8);
  }
  .phone-number {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 900;
    letter-spacing: .025em;
    font-size: clamp(1.15rem, 4.4vw, 2rem);
    text-shadow:
      0 2px 0 #071d4b,
      0 3px 5px rgba(0,0,0,.45);
    white-space: nowrap;
  }
  .whatsapp-button:hover {
    filter: brightness(1.08);
    transform: translateY(-2px);
    box-shadow:
      0 9px 0 #755914,
      0 15px 24px rgba(0,0,0,.34),
      inset 0 2px 1px rgba(255,255,255,.58),
      inset 0 -4px 7px rgba(0,0,0,.28);
  }
  .whatsapp-button:active {
    transform: translateY(5px);
    box-shadow:
      0 2px 0 #755914,
      0 5px 10px rgba(0,0,0,.28),
      inset 0 2px 5px rgba(0,0,0,.25);
  }
  .whatsapp-button:focus-visible {
    outline: 4px solid rgba(28, 125, 255, .7);
    outline-offset: 3px;
  }

  @media (max-width: 480px) {
    .page { padding: 8px; }
    .whatsapp-button {
      left: 49%;
      right: 1.2%;
      bottom: 1.6%;
      min-height: 48px;
      padding: .45em .6em;
      border-width: 2px;
      border-radius: 13px;
      box-shadow:
        0 5px 0 #755914,
        0 8px 13px rgba(0,0,0,.3),
        inset 0 2px 1px rgba(255,255,255,.55),
        inset 0 -3px 5px rgba(0,0,0,.25);
    }
    .whatsapp-icon { width: 1.3em; height: 1.3em; font-size: .9em; }
  }
</style>
</head>
